<style>
:root {
  --ground: #eaeefa;
  --card: #ffffff;
  --ink: #121212;
  --muted: #383838;
  --soft: #4a4a4a;
  --blue: #2e55c8;
  --blue-deep: #1c3378;
  --blue-line: #7e97e1;
  --green: #1bb166;
  --green-deep: #106a3d;
  --green-ink: #03120a;
  --red: #ed6154;
  --red-ink: #ae2012;
  --ring: #12214f;
  --radius-action: 0.625rem;
  --radius-card: 1rem;
  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --bar-h: 92px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
html { scrollbar-width: none; -webkit-text-size-adjust: 100%; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 160ms ease;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card);
}
button, a { font-family: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 4px solid var(--ring); outline-offset: 3px; }
picture { display: contents; }
.ic { width: 1em; height: 1em; display: block; fill: currentColor; flex-shrink: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Top: phrase + actions */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--card);
  box-shadow: 0 4px 0 rgba(18, 33, 79, 0.08);
  padding: 12px var(--gutter-r) 12px var(--gutter-l);
}
.top-in { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.phrase {
  min-width: 0; min-height: 76px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 6px 8px; border: 3px dashed var(--blue-line); border-radius: var(--radius-card); background: var(--card);
}
.phrase-empty { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--soft); line-height: 1.25; }
.phrase-empty .ic { font-size: 28px; color: var(--blue); }
.chip {
  width: 56px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  background: var(--card); border: 3px solid; border-radius: 8px; overflow: hidden;
}
.chip img { width: 36px; height: 36px; object-fit: contain; }
.chip span { font-size: 8px; font-weight: 800; text-transform: uppercase; max-width: 50px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.is-speaking { box-shadow: 0 0 0 3px var(--ring); }
.actions { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; gap: 10px; }
.btn {
  height: 64px; border-radius: var(--radius-card); border: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 20px; font-weight: 900; letter-spacing: 0.04em; text-decoration: none; text-transform: uppercase;
  transition: transform 80ms ease;
}
.btn:active { transform: translateY(3px); }
.btn .ic { font-size: 34px; }
.btn-speak { background: var(--green); color: var(--green-ink); box-shadow: 0 5px 0 var(--green-deep); }
.btn-home { background: var(--card); color: var(--blue-deep); border: 3px solid var(--blue); box-shadow: 0 5px 0 var(--blue-deep); }
.btn-erase { background: var(--card); color: var(--red-ink); border: 3px solid var(--red); box-shadow: 0 5px 0 var(--red); }

/* Main */
main {
  padding: 24px var(--gutter-r) 32px var(--gutter-l);
  max-width: calc(1100px + 32px); margin: 0 auto;
  display: flex; flex-direction: column; gap: 24px;
}
.brand { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.brand h1 { margin: 0; font-size: clamp(34px, 9vw, 56px); font-weight: 900; line-height: 1; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.brand p { margin: 0; font-size: 17px; font-weight: 700; color: var(--muted); }
.section-title { margin: 0; font-size: 20px; font-weight: 900; color: var(--blue-deep); }
.stack { display: flex; flex-direction: column; gap: 12px; }

.grid-quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid-voices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile:last-child:nth-child(odd) { grid-column: 1 / -1; }

/* Tablet */
@media (min-width: 34em) {
  .grid-items { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-quick { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .grid-nav { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .grid-voices { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .tile { grid-column: span 2; }
  .tile:nth-child(4) { grid-column: 2 / span 2; }
  .tile:last-child:nth-child(odd) { grid-column: 4 / span 2; }
}
/* Desktop */
@media (min-width: 56em) {
  .top-in { flex-direction: row; align-items: stretch; }
  .phrase { flex: 1; }
  .actions { width: 380px; flex-shrink: 0; align-self: center; }
  .grid-items { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
  .grid-tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .tile, .tile:nth-child(4), .tile:last-child:nth-child(odd) { grid-column: auto; }
  .card img { max-width: 140px; }
  .pill h1 { font-size: 30px; }
}

.card {
  min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px;
  padding: 12px 6px 10px; background: var(--card); border: 6px solid; border-radius: var(--radius-card);
  box-shadow: 0 5px 0 rgba(18, 33, 79, 0.16); transition: transform 80ms ease, box-shadow 120ms ease;
}
.card:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(18, 33, 79, 0.16); }
.card img { width: 100%; max-width: 120px; height: auto; aspect-ratio: 1; object-fit: contain; }
.card span { font-size: 17px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.1; text-align: center; overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }
.card.is-on { box-shadow: 0 0 0 5px var(--ring); }
.card.small { padding: 8px 4px; border-width: 5px; }
.card.small img { max-width: 72px; }
.card.small span { font-size: 13px; }

.tile {
  min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 16px 8px; border-radius: var(--radius-card); text-decoration: none; transition: transform 80ms ease;
}
.tile:active { transform: translateY(3px); }
.tile .disc { width: 96px; height: 96px; padding: 8px; background: var(--card); border-radius: 9999px; display: flex; align-items: center; justify-content: center; }
.tile .disc img { width: 100%; height: 100%; object-fit: contain; }
.tile span { font-size: 18px; font-weight: 900; letter-spacing: 0.03em; text-transform: uppercase; text-align: center; overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }

.head { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 5px 20px 5px 5px; border-radius: 9999px; max-width: 100%; }
.pill .disc { width: 48px; height: 48px; padding: 4px; background: var(--card); border-radius: 9999px; flex-shrink: 0; }
.pill .disc img { width: 100%; height: 100%; object-fit: contain; }
.pill h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 0.03em; text-transform: uppercase; line-height: 1.1; overflow-wrap: anywhere; }
.head p { margin: 0; font-size: 17px; font-weight: 600; color: var(--muted); }

.navchip {
  min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 8px 4px; border: 3px solid; border-radius: var(--radius-action); background: var(--card); text-decoration: none;
}
.navchip img { width: 40px; height: 40px; object-fit: contain; background: var(--card); border-radius: 9999px; }
.navchip span { hyphens: auto; -webkit-hyphens: auto; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.01em; max-width: 100%; overflow-wrap: anywhere; text-align: center; line-height: 1.1; }

.voice {
  min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-height: 72px;
  background: var(--card); border: 3px solid #c9d3f0; border-radius: var(--radius-card); text-align: left;
  box-shadow: 0 4px 0 rgba(18, 33, 79, 0.12); transition: transform 80ms ease;
}
.voice:active { transform: translateY(3px); }
.voice .face { width: 44px; height: 44px; flex-shrink: 0; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #121212; }
.voice b { display: block; font-size: 18px; font-weight: 900; }
.voice small { display: block; font-size: 13px; font-weight: 700; color: var(--soft); }
.voice[aria-pressed="true"] { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring); }
.voice[aria-pressed="true"] small::after { content: " · elegida"; color: var(--green-deep); }
.link-guide {
  align-self: center; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px;
  background: var(--card); border: 2px solid #a8b9eb; border-radius: var(--radius-action);
  color: var(--blue-deep); font-weight: 800; text-decoration: none;
}
.link-guide .ic { font-size: 22px; }

/* Bottom: always-available answers */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  background: var(--card); box-shadow: 0 -4px 0 rgba(18, 33, 79, 0.08);
}
.bar-in { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.answer {
  min-width: 0; height: calc(var(--bar-h) - 20px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 5px solid; border-radius: var(--radius-card); font-size: 18px; font-weight: 900; letter-spacing: 0.03em; color: var(--ink); line-height: 1;
  transition: transform 80ms ease;
}
.answer:active { transform: translateY(3px); }
.answer img { width: 38px; height: 38px; object-fit: contain; }
.answer.is-on { box-shadow: 0 0 0 4px var(--ring); }
@media (min-width: 56em) {
  .answer { flex-direction: row; gap: 12px; font-size: 22px; }
  .answer img { width: 48px; height: 48px; }
}

/* Guide */
.guide-col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.guide-grid { display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 48em) { .guide-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
.panel { background: var(--card); border-radius: var(--radius-card); padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 0 rgba(18, 33, 79, 0.08); min-width: 0; }
.panel h2 { margin: 0; font-size: 22px; font-weight: 900; color: var(--blue-deep); text-wrap: balance; }
.panel p, .panel li { margin: 0; font-size: 16px; line-height: 1.5; color: #242424; overflow-wrap: anywhere; }
.panel ol, .panel ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.code { display: flex; align-items: center; gap: 14px; }
.code .swatch { width: 64px; height: 64px; flex-shrink: 0; padding: 5px; background: var(--card); border: 5px solid; border-radius: 12px; }
.code .swatch img { width: 100%; height: 100%; object-fit: contain; }
.code strong { display: block; font-size: 17px; font-weight: 800; }
.code span { font-size: 15px; color: var(--soft); }
.tag { display: inline-block; align-self: flex-start; padding: 2px 10px; background: #f39c12; border-radius: 9999px; font-size: 12px; font-weight: 900; letter-spacing: 0.04em; color: var(--ink); }
.note { padding: 12px 14px; background: #fef5e7; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; }
.panel a { color: #2544a2; }

/* Footer: authorship, above the fixed answer bar */
.foot {
  max-width: calc(1100px + 32px); margin: 0 auto;
  padding: 0 var(--gutter-r) calc(var(--bar-h) + 36px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
}
.foot p {
  margin: 0; padding: 16px 18px; border-top: 2px solid #c9d3f0;
  font-size: 14px; line-height: 1.5; color: var(--muted); text-align: center; overflow-wrap: anywhere;
}
.foot strong { color: var(--ink); font-weight: 800; }

@media (prefers-reduced-motion: reduce) {
  body, .btn, .card, .tile, .answer, .voice { transition: none; }
  .btn:active, .card:active, .tile:active, .answer:active, .voice:active { transform: none; }
}
</style>

  vs.appendChild(gv);

  const g = el('a', 'link-guide'); g.href = '#guia'; g.innerHTML = '<svg class="ic"><use href="#i-help"/></svg>Guía para adultos';
  view.append(brand, q, t, vs, g);
  warm();
}

function renderCat(c) {
  const head = el('div', 'head');
  const pill = el('div', 'pill'); pill.style.background = c.color; pill.style.color = c.ink;
  const d = el('span', 'disc'); d.appendChild(pic(c.img, false));
  pill.append(d, el('h1', '', c.title));
  head.append(pill, el('p', '', c.hint));
  const grid = el('div', 'grid-items'); c.items.forEach((it) => grid.appendChild(card(it, false)));
  const other = el('section', 'stack'); other.append(el('h2', 'section-title', 'Otros temas'));
  const nav = el('div', 'grid-nav');
  DATA.cats.forEach((o) => {
    const a = el('a', 'navchip'); a.href = '#' + o.id; a.style.borderColor = o.color;
    if (o.id === c.id) { a.style.background = o.color; a.style.color = o.ink; a.setAttribute('aria-current', 'page'); }
    a.append(pic(o.img, true), el('span', '', o.label)); nav.appendChild(a);
  });
  other.appendChild(nav);
  document.body.style.background = c.tint;
  view.append(head, grid, other);
  warm();
}

function renderGuide() {
  const head = el('div', 'head');
  const pill = el('div', 'pill'); pill.style.background = '#2e55c8'; pill.style.color = '#ffffff'; pill.style.paddingLeft = '20px';
  pill.append(el('h1', '', 'Guía para adultos'));
  head.append(pill, el('p', '', 'Cómo funciona el comunicador y de dónde salen sus dibujos y sus voces'));

  const codes = el('section', 'panel');
  codes.append(el('h2', '', 'Código de colores'), el('p', '', 'El borde de cada dibujo dice qué tipo de palabra es, como en los tableros del sistema SPC. Así se aprende a ordenar la frase: quién, qué hace, qué cosa.'));
  [['per', 'excursionista', 'Amarillo · Personas', 'excursionista'], ['acc', 'comer', 'Verde · Acciones', 'acampar, comer, dormir, quiero'], ['nom', 'mochila', 'Naranja · Cosas y sitios', 'mochila, bosque, bocadillo, gorra'], ['soc', 'hola', 'Rosa · Para relacionarse', 'hola, adiós, por favor, gracias']].forEach(([code, id, name, ex]) => {
    const r = el('div', 'code'); const sw = el('span', 'swatch'); sw.style.borderColor = SPC[code];
    sw.appendChild(pic(id, true));
    const tx = el('div'); tx.append(el('strong', '', name), el('span', '', ex)); r.append(sw, tx); codes.appendChild(r);
  });

  const how = el('section', 'panel'); how.append(el('h2', '', 'Cómo se usa'));
  const ol = el('ol');
  ['Toca un dibujo: se oye su palabra y se añade a la frase de arriba.', 'Toca HABLAR para oír la frase entera. La papelera roja quita el último dibujo.', 'SÍ, NO y AYUDA están siempre abajo, en todas las pantallas.', 'La casa azul vuelve al inicio. Debajo de cada tema hay atajos a los demás.', 'Si en un iPhone o iPad no se oye nada, quita el modo silencio y sube el volumen.'].forEach((x) => ol.appendChild(el('li', '', x)));
  how.appendChild(ol);

  const motor = el('section', 'panel'); motor.append(el('h2', '', 'Pensado para manos que se mueven con dificultad'));
  const ul = el('ul');
  ['Dibujos grandes y separados, para acertar sin precisión.', 'Lo importante siempre en el mismo sitio: la frase arriba, las respuestas abajo.', 'La frase se guarda al cambiar de tema, así se monta «Quiero» + «Linterna».', 'Se adapta al móvil, a la tableta y al ordenador.', 'Cuatro voces para elegir, dos de mujer y dos de hombre.'].forEach((x) => ul.appendChild(el('li', '', x)));
  const note = el('div', 'note'); note.append(el('span', 'tag', 'PROPUESTA'), el('p', '', 'Barrido con pulsador: los botones se iluminan de uno en uno y la persona pulsa un único botón grande cuando llega al que quiere.'));
  motor.append(ul, note);

  const total = DATA.quick.length + DATA.rail.length + DATA.cats.reduce((n, c) => n + c.items.length, 0);
  const cred = el('section', 'panel'); cred.append(el('h2', '', 'Dibujos y voces'));
  const p1 = el('p'); p1.innerHTML = 'Pictogramas: Sergio Palao. Origen: ARASAAC (<a href="https://arasaac.org" target="_blank" rel="noopener">arasaac.org</a>). Licencia: CC BY-NC-SA. Propiedad: Gobierno de Aragón (España).';
  const p2 = el('p', '', 'Voces: grabadas con los programas libres Piper y Kokoro, una grabación por palabra y por voz. Se elige la voz en el inicio.');
  const vl = el('ul'); DATA.voices.forEach((v) => vl.appendChild(el('li', '', v.name + ' (' + v.kind.toLowerCase() + ', ' + v.accent + '): ' + v.credit)));
  const p3 = el('p', '', (DATA.cats.length + 2) + ' pantallas enlazadas y ' + total + ' pictogramas, cada uno con su sonido.');
  cred.append(p1, p2, vl, p3);

  const grid = el('div', 'guide-grid');
  const c1 = el('div', 'guide-col'); c1.append(codes, cred);
  const c2 = el('div', 'guide-col'); c2.append(how, motor);
  grid.append(c1, c2);
  view.append(head, grid);
}

function route(fromClick) {
  const id = (location.hash || '#inicio').slice(1);
  view.textContent = '';
  document.body.style.background = '';
  const c = DATA.cats.find((x) => x.id === id);
  if (c) { renderCat(c); if (fromClick) say(c.label); document.title = c.title + ' · Comunicador de acampada'; }
  else if (id === 'guia') { renderGuide(); document.title = 'Guía para adultos · Comunicador de acampada'; }
  else { renderHome(); document.title = 'Comunicador de acampada'; }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => route(true));

const bar = document.getElementById('bar');
DATA.rail.forEach(([label, text, color, tint, id]) => {
  const b = el('button', 'answer'); b.type = 'button'; b.style.borderColor = color; b.style.background = tint; b.setAttribute('aria-label', text);
  b.append(pic(id, false), el('span', '', label));
  b.addEventListener('click', () => { flash(b); say(text); });
  bar.appendChild(b);
});
renderPhrase();
route(false);
</script>
</body>
</html>
